<meta name="description" content="NIGHT STYLE編集部による店舗コラムの一覧。関西・関東のお店の働き方やお給料のしくみを紹介しています。リゾートの特集も。">
<link rel="canonical" href="https://lambent-lebkuchen-007367.netlify.app/column/index.html">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FFFFFF;--panel:#FFF5F9;--panel2:#F7F4FF;--line:rgba(224,127,163,.25);--ink:#46405A;--soft:#756E88;--gold:#E07FA3;--gold-lt:#8A73D1;--pink:#E8759D;
    --goldgrad:linear-gradient(135deg,#F2A7C3 0%,#F8C6D8 28%,#FDE7F0 50%,#D8C8F6 72%,#F2A7C3 100%);
    --serif:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;--en:'Quicksand',serif;--body:'Noto Sans JP','Hiragino Sans',sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:#FDF6FA;color:var(--ink);font-family:var(--body);line-height:1.95;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  img,video{display:block;max-width:100%}
  .page{max-width:1000px;margin:0 auto;background:var(--bg);min-height:100vh}
  .head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#FFFFFF;border-bottom:1px solid var(--line)}
  .logo{font-family:var(--en);font-weight:700;font-size:1.6rem;letter-spacing:.06em;background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none}
  .head nav a{color:var(--gold-lt);border:1px solid var(--line);border-radius:6px;padding:6px 11px;font-size:.74rem;text-decoration:none}
  .crumb{font-size:.7rem;color:#9C96AC;padding:8px 16px;white-space:nowrap;overflow-x:auto}
  .crumb a{text-decoration:underline;text-underline-offset:3px}
  article{padding:8px 16px 30px}
  .cat{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.1em;color:#46405A;background:var(--goldgrad);border-radius:4px;padding:1px 9px}
  h1{font-family:var(--serif);font-size:1.4rem;line-height:1.6;letter-spacing:.04em;margin:10px 0 4px}
  .date{font-size:.72rem;color:#9C96AC;margin:0 0 14px}
  .eye{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#FFFFFF;margin:0 0 18px}
  .eye img{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover}
  .ph{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 16px}.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .lead{font-size:.95rem}
  h2{font-family:var(--serif);font-size:1.12rem;letter-spacing:.06em;margin:30px 0 12px;padding:9px 12px;background:var(--panel2);color:var(--gold-lt);border-left:4px solid var(--pink);border-radius:6px}
  p{margin:0 0 14px;font-size:.92rem}
  b{color:var(--gold-lt)}
  ul,ol{margin:0 0 14px;padding-left:1.4em;font-size:.92rem}
  li{margin-bottom:8px}
  .box{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 14px 4px;margin:0 0 16px}
  .box h3{margin:0 0 8px;font-size:.92rem;color:var(--gold-lt)}
  table{width:100%;border-collapse:collapse;font-size:.86rem;margin:0 0 16px}
  th,td{border:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
  th{background:var(--panel2);width:32%;color:var(--gold-lt);font-weight:700}
  .plan{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
  .plan div{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:12px 8px;text-align:center}
  .plan strong{display:block;font-family:var(--en);letter-spacing:.12em;color:var(--gold-lt);font-size:1.05rem}
  .plan span{display:block;font-size:.82rem;line-height:1.6;margin-top:4px}
  .cta{margin:26px 0 0;border:1px solid var(--gold);border-radius:12px;padding:20px 16px;text-align:center;background:var(--panel)}
  .cta p{color:var(--soft);font-size:.84rem;margin:0 0 12px}
  .cta a{display:inline-block;background:var(--goldgrad);color:#46405A;font-weight:700;text-decoration:none;border-radius:8px;padding:12px 26px;letter-spacing:.06em}
  .note{font-size:.74rem;color:#9C96AC;margin-top:22px}
  footer{text-align:center;font-size:.72rem;color:#9C96AC;padding:20px 16px 30px;border-top:1px solid var(--line)}
  footer a{margin:0 8px}
  .eyebox{border:1px solid var(--line);border-radius:12px;background:radial-gradient(120% 90% at 50% 0%,#46405A 0%,#FFFFFF 70%);padding:34px 16px;text-align:center;margin:0 0 18px}
  .eyebox b{display:block;font-family:var(--en);font-size:2.1rem;letter-spacing:.12em;background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .eyebox span{display:block;font-size:.8rem;color:var(--soft);letter-spacing:.2em;margin-top:6px}
  .cmp th{width:40%;white-space:nowrap;font-size:.8rem}
</style>

</head>
