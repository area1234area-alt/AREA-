<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>来店確認のしくみ｜Area</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F8; --card:#FFFFFF; --soft:#F4F7FB; --line:#D8E0EC; --ink:#131B2C; --sub:#5A667D;
  --blue:#2F6BEA; --blue2:#E4EDFD; --ok:#1F8A5B; --ok2:#E1F3EA;
  --sans:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0A0F1C; --card:#131B2E; --soft:#1A2339; --line:#27324E; --ink:#E9EEFA; --sub:#A3AFC8;
  --blue:#6E9BFF; --blue2:#1B2A52; --ok:#4FC98F; --ok2:#11301F; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;
  padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:440px;margin:0 auto}
h1{font-size:21px;font-weight:900;margin:0 0 4px;text-align:center}
.lead{text-align:center;color:var(--sub);font-size:13px;margin:0 0 16px}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.dots i{width:28px;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;min-height:330px;display:flex;flex-direction:column}
.who{align-self:flex-start;font-size:12px;font-weight:700;border-radius:999px;padding:3px 12px;margin-bottom:10px}
.who.c{background:var(--blue2);color:var(--blue)}
.who.s{background:var(--ok2);color:var(--ok)}
.who.a{background:var(--soft);color:var(--sub);border:1px solid var(--line)}
h2{font-size:19px;margin:0 0 6px;font-weight:900}
p.ex{margin:0 0 14px;color:var(--sub);font-size:14px}
.shops{display:grid;gap:8px}
.shops button{display:flex;justify-content:space-between;align-items:center;font:inherit;text-align:left;color:var(--ink);background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.shops button.on{border-color:var(--blue);background:var(--blue2)}
.shops small{color:var(--sub);font-size:12px}
.big{display:block;width:100%;margin-top:auto;font:900 16px var(--sans);border:0;border-radius:14px;padding:15px;cursor:pointer;background:var(--blue);color:#fff}
.big.green{background:var(--ok)}
.big:disabled{opacity:.4;cursor:not-allowed}
.box{background:var(--soft);border-radius:14px;padding:16px;text-align:center;margin-bottom:16px}
.box .k{font-size:12px;color:var(--sub)}
.box .v{font-size:28px;font-weight:900;letter-spacing:.06em;color:var(--blue)}
.box .v.g{color:var(--ok)}
.qr{width:120px;height:120px;margin:4px auto 8px;border-radius:10px;background:
  conic-gradient(from 90deg at 30% 30%,var(--ink) 25%,transparent 0) 0 0/24px 24px,
  conic-gradient(from 0deg at 70% 70%,var(--ink) 25%,transparent 0) 12px 12px/24px 24px,#fff;border:8px solid #fff;box-shadow:0 0 0 1px var(--line)}
.back{display:block;margin:12px auto 0;font:700 13px var(--sans);color:var(--sub);background:none;border:0;cursor:pointer;text-decoration:underline}
.how{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.how h3{margin:0 0 8px;font-size:15px}
.how ol{margin:0;padding-left:1.3em;font-size:14px}
.how li{margin:4px 0}
.how p{font-size:12px;color:var(--sub);margin:10px 0 0}
.note{text-align:center;font-size:11px;color:var(--sub);margin-top:14px}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>来店確認のしくみ</h1>
  <p class="lead">お客様が来店したときだけ広告料がかかります</p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="card" id="card"></div>

  <section class="how">
    <h3>使い方（4ステップ）</h3>
    <ol>
      <li><b>お客様</b>がAreaでお店を選び「紹介IDをもらう」</li>
      <li><b>お客様</b>がお店に着いたら、入口のQRをスマホで読む</li>
      <li><b>お店</b>のタブレットに通知が届き「来店を承認」を押す</li>
      <li>広告料が自動で計上され、<b>月末にまとめて請求</b></li>
    </ol>
    <p>QRを読んで、お店が承認したときだけ広告料が発生します。来ていないお客様の分は請求されません。同じお客様の2回目以降の来店も無料です。</p>
  </section>
  <p class="note">架空のお店を使ったデモです。</p>
</div>

<script>
(function(){
  var SHOPS = [
    { name:"居酒屋 ほたる", g:"居酒屋", fee:1000 },
    { name:"Bar ルナ", g:"バー", fee:1000 },
    { name:"Club オーロラ", g:"キャバクラ", fee:2000 }
  ];
  var step = 0, pick = null, id = "", total = 6000;
  var card = document.getElementById("card");
  function dots(){ [].forEach.call(document.querySelectorAll("#dots i"), function(d, i){ d.classList.toggle("on", i <= step); }); }
  function yen(n){ return n.toLocaleString("ja-JP") + "円"; }
  function render(){
    dots();
    var s = pick != null ? SHOPS[pick] : null, h = "";
    if (step === 0) {
      h = '<span class="who c">お客様のスマホ</span><h2>行くお店を選ぶ</h2><p class="ex">お店を選んで、紹介IDをもらいます。</p><div class="shops">'
        + SHOPS.map(function(x, i){ return '<button data-i="' + i + '" class="' + (pick === i ? 'on' : '') + '"><span>' + x.name + '</span><small>' + x.g + '</small></button>'; }).join("")
        + '</div><button class="big" id="go" style="margin-top:16px"' + (pick == null ? ' disabled' : '') + '>紹介IDをもらう</button>';
    } else if (step === 1) {
      h = '<span class="who c">お客様のスマホ</span><h2>お店に着いたらQRを読む</h2><p class="ex">' + s.name + 'の入口にあるQRを読みます。</p>'
        + '<div class="box"><div class="k">あなたの紹介ID</div><div class="v">' + id + '</div></div><div class="qr" aria-hidden="true"></div>'
        + '<button class="big" id="go">QRを読む</button>';
    } else if (step === 2) {
      h = '<span class="who s">お店のタブレット</span><h2>来店の通知が届きました</h2><p class="ex">お客様が来ていることを確認して、承認します。</p>'
        + '<div class="box"><div class="k">紹介ID ' + id + '</div><div class="v g">2名様 来店</div></div>'
        + '<button class="big green" id="go">来店を承認</button>';
    } else {
      h = '<span class="who a">運営の管理画面</span><h2>広告料が計上されました</h2><p class="ex">月末に、お店ごとにまとめて請求します。</p>'
        + '<div class="box"><div class="k">今回の広告料（' + s.name + '）</div><div class="v">' + yen(s.fee) + '</div></div>'
        + '<div class="box"><div class="k">今月の請求予定（全店）</div><div class="v g">' + yen(total) + '</div></div>'
        + '<button class="big" id="go">もう一度試す</button>';
    }
    card.innerHTML = h;
    [].forEach.call(card.querySelectorAll("[data-i]"), function(b){ b.onclick = function(){ pick = +b.dataset.i; render(); }; });
    document.getElementById("go").onclick = next;
    if (step > 0 && step < 3) { var bk = document.createElement("button"); bk.className = "back"; bk.textContent = "ひとつ戻る"; bk.onclick = function(){ step--; render(); }; card.appendChild(bk); }
  }
  function next(){
    if (step === 0) { id = "AR-" + Math.random().toString(36).slice(2,6).toUpperCase(); step = 1; }
    else if (step === 1) step = 2;
    else if (step === 2) { total += SHOPS[pick].fee; step = 3; }
    else { step = 0; pick = null; }
    render(); window.scrollTo({ top: 0, behavior: "smooth" });
  }
  render();
})();
</script>
</body>
</html>
